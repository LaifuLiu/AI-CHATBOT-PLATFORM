name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@v5  # It's a best practice to pin to a specific version [citation:2][citation:4]
      with:
        # Pin a specific version for reproducibility [citation:2]
        # Enable caching to speed up workflows [citation:1][citation:6]
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked # Now uv is available [citation:4]

    - name: Lint with Ruff
      run: |
        ruff check .
        black --check .

    # - name: Test with pytest
    #   run: |
    #     pytest