name: chatbot-postgresql

services:

  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      # persist ollama models
      - ollama_data:/root/.ollama

      # your gguf file
      - /home/liu-laifu/Models:/models:ro

      # Modelfile
      - ./ollama/Modelfile:/Modelfile:ro

      # startup script
      - ./ollama/entrypoint.sh:/entrypoint.sh

    entrypoint:
      - /bin/bash
      - /entrypoint.sh

  redis:
    image: redis:latest

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  postgres:
    image: postgres:latest

    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_password
      POSTGRES_DB: chatbot_db

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chatbot -d chatbot_db" ]

      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  chatbot:

    build:
      context: .

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      ollama:
        condition: service_started

    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  ollama_data:
  redis_data:
  postgres_data:
